<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Practice Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">

    <img id="pic" src="happy.png" alt="happy face" width="150px">

    <h2 id="nameDisplay">Mark Jefferson Briones</h2>
    <p>BS Information Technology</p>

     <input id="nameBox" type="text" placeholder="Type your name...">

     <br><br>

     <label for="focusBox">Focus/Blur test</label>
     <input id="focusBox" type="text" placeholder="Click here...">

     <br><br>

     <label for="yearSelect">Year Level:</label>
     <select id="yearSelect">
        <option value="">--Select Year--</option>
        <option value="1st year">1st Year</option>
        <option value="2nd Year">2nd Year</option>
        <option value="3rd Year">3rd Year</option>
        <option value="4th Year">4th Year</option>
     </select>

     <br><br>

    <button id="btn1">Click Me</button>
    <button id="doubleClick">Double Click Me</button>
    <button id="btnHold">Press &amp; Hold</button>

    <p id="status">Try clicking or typing something above.</p>    

    </div>

    <script src="script.js"></script>
</body>
</html>
